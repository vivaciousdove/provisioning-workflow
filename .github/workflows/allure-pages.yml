name: Publish Allure Report (GitHub Pages)

on:
  workflow_run:
    workflows: ["CI - Provisioning Workflow (Playwright + FastAPI + MySQL + Allure)"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download allure results artifact (UI)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download allure results artifact (API)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api
          run-id: ${{ github.event.workflow_run.id }}

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          cp -r allure-results-ui/* allure-results/ || true
          cp -r allure-results-api/* allure-results/ || true

      - name: Generate Allure HTML
        run: |
          npm i -D allure-commandline
          npx allure generate allure-results --clean -o allure-report

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
